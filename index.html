<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Kurye Platformu · Yönetim</title>
<style>
:root{--navy:#0B1F3A;--navy2:#16305A;--bg:#F5F7FA;--card:#fff;--tx:#0B1F3A;--bd:#DDE3EC;--mu:#6B7A90;--or:#FF7A1A;--gr:#12B76A;--rd:#D92D20;--bl:#2E6FDB;
--okbg:#D1FADF;--okfg:#067647;--wabg:#FEF0C7;--wafg:#B54708;--rdbg:#FEE4E2;--rdfg:#B42318}
@media (prefers-color-scheme:dark){:root{--bg:#0d1626;--card:#16243a;--tx:#e8eef7;--bd:#2a3a55;--mu:#93a4bd;--okbg:#0f3b2a;--okfg:#6ce9a6;--wabg:#4a3510;--wafg:#fdb022;--rdbg:#4a1714;--rdfg:#fda29b;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);font-size:14px}
header{background:var(--navy);color:#fff;padding:12px max(16px,env(safe-area-inset-left));position:sticky;top:0;z-index:5}
header .row1{display:flex;align-items:center;gap:10px}
header h1{font-size:17px;margin:0;flex:1}
header button{background:none;border:1.5px solid #ffffff55;color:#fff;border-radius:10px;padding:6px 10px;font-weight:700;cursor:pointer}
nav{display:flex;gap:6px;overflow-x:auto;margin-top:10px;padding-bottom:2px}
nav a{flex-shrink:0;color:#ffffffc8;text-decoration:none;padding:7px 12px;border-radius:99px;font-weight:700;font-size:13px;background:var(--navy2)}
nav a.on{background:#fff;color:var(--navy)}
main{padding:16px max(16px,env(safe-area-inset-left)) 40px;max-width:1100px;margin:0 auto}
h2{font-size:20px;margin:4px 0 12px}h3{font-size:16px;margin:20px 0 8px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:10px}
.card b.big{display:block;font-size:24px;margin-top:2px;font-variant-numeric:tabular-nums}
.mu{color:var(--mu);font-size:13px}
.err{color:var(--rd);margin:8px 0;font-weight:600}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sp{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.sp>*{min-width:0}
button.b{border:0;border-radius:10px;padding:8px 12px;font-weight:700;cursor:pointer;background:var(--navy);color:#fff;font-size:13px}
button.g{background:transparent;color:var(--tx);border:1.5px solid var(--bd)}
button.ok{background:var(--gr)}button.dg{background:var(--rd)}
button:disabled{opacity:.5}
input,select,textarea{padding:10px;border:1.5px solid var(--bd);border-radius:10px;font-size:15px;background:var(--card);color:var(--tx);font-family:inherit;width:100%}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:12px}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:800;background:var(--bd)}
.pill.active,.pill.approved,.pill.captured,.pill.paid,.pill.completed,.pill.resolved{background:var(--okbg);color:var(--okfg)}
.pill.pending,.pill.open,.pill.processing,.pill.investigating,.pill.assigned,.pill.in_progress,.pill.draft{background:var(--wabg);color:var(--wafg)}
.pill.suspended,.pill.rejected,.pill.cancelled,.pill.failed,.pill.dismissed,.pill.refunded{background:var(--rdbg);color:var(--rdfg)}
table{width:100%;border-collapse:collapse}td,th{padding:7px 6px;text-align:left;border-bottom:1px solid var(--bd)}th{font-size:11px;color:var(--mu);text-transform:uppercase}
td.n{text-align:right;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto}
.login{max-width:420px;margin:8vh auto;background:var(--card);border-radius:18px;padding:22px}
.login label{display:block;font-weight:700;font-size:13px;margin:10px 0 4px}
.login button{width:100%;padding:13px;margin-top:14px;font-size:15px}
.note{background:var(--bg);border:1px dashed var(--bd);border-radius:10px;padding:10px;font-size:12px;color:var(--mu);margin-top:12px}
</style>
</head>
<body>
<div id="app"><main><p class="mu">Yükleniyor…</p></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<script>
"use strict";
// Kurye Platformu · tek dosyalık geçici yönetim paneli.
// Next.js panelindeki (apps/admin) sorguların aynısını kullanır. Yetki, giriş yapan yöneticinin oturumu ve
// veritabanındaki RLS kuralları ile sağlanır. Buraya ASLA secret / service role anahtarı yazma.
const DEFAULT_URL="https://uglrybjtamnhcqavamgc.supabase.co";
const store={get:k=>{try{return localStorage.getItem(k)||""}catch(_){return ""}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(_){}},del:k=>{try{localStorage.removeItem(k)}catch(_){}}};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>"₺"+Number(n||0).toLocaleString("tr-TR",{minimumFractionDigits:2,maximumFractionDigits:2});
const when=s=>s?new Date(s).toLocaleString("tr-TR"):"-";
const one=v=>Array.isArray(v)?(v[0]??null):(v??null);
const pill=(s,label)=>`<span class="pill ${esc(s)}">${esc(label??s)}</span>`;
const ROLE={business:"İşletme",courier:"Kurye",admin:"Yönetici"},ACC={pending:"Bekliyor",active:"Aktif",suspended:"Askıda"};
const VEH={bicycle:"Bisiklet",motorcycle:"Motosiklet",car:"Otomobil",van:"Kamyonet"};
const DOC={license:"Ehliyet",id_card:"Kimlik",vehicle_registration:"Ruhsat",insurance:"Sigorta",criminal_record:"Adli sicil",other:"Diğer"};
const LST={draft:"Taslak",open:"Kurye aranıyor",assigned:"Kurye seçildi",in_progress:"Yolda",completed:"Tamamlandı",cancelled:"İptal",expired:"Süresi doldu"};
const CMP={open:"Açık",investigating:"İnceleniyor",resolved:"Çözüldü",dismissed:"Reddedildi"};
const NAV=[["panel","Genel bakış"],["kullanicilar","Kullanıcılar"],["isletmeler","İşletme onayı"],["kuryeler","Kurye doğrulama"],["ilanlar","İlanlar"],["sikayetler","Şikâyetler"],["odemeler","Ödemeler"],["ayarlar","Komisyon ve ayarlar"]];
let sb=null,view="panel",msg="",filt={q:"",role:"",status:""};
const app=document.getElementById("app");
const unwrap=r=>{if(r.error)throw new Error(r.error.message);return r.data};

function makeClient(){const url=store.get("sb_url")||DEFAULT_URL,key=store.get("sb_key");if(!key||!window.supabase)return null;return window.supabase.createClient(url,key,{auth:{persistSession:true,storageKey:"kurye-admin-auth"}})}

/* ---------- giriş ---------- */
function loginView(err){app.innerHTML=`<div class="login"><h2>Yönetim girişi</h2>
<p class="mu">Kurye Platformu yönetici hesabınla giriş yap.</p>
<label for="u">Supabase proje adresi</label><input id="u" value="${esc(store.get("sb_url")||DEFAULT_URL)}">
<label for="k">Publishable key (veya legacy anon key)</label><input id="k" value="${esc(store.get("sb_key"))}" placeholder="sb_publishable_... ya da eyJ...">
<label for="e">E-posta</label><input id="e" type="email" autocomplete="email">
<label for="p">Şifre</label><input id="p" type="password" autocomplete="current-password">
${err?`<div class="err">${esc(err)}</div>`:""}
<button class="b" id="go">Giriş yap</button>
<div class="note">Anahtarı Supabase'de <b>Settings → API Keys</b> sayfasındaki <b>Publishable key</b> alanından kopyala. "Secret key" yazanı asla buraya yapıştırma. Adres ve publishable key bu tarayıcıda hatırlanır; şifre saklanmaz.</div></div>`;
document.getElementById("go").onclick=doLogin;document.getElementById("p").onkeydown=e=>{if(e.key==="Enter")doLogin()}}
async function doLogin(){const g=id=>document.getElementById(id).value.trim();
 const key=g("k");if(!key)return loginView("Publishable key gerekli.");if(/^sb_secret_/.test(key))return loginView("Bu bir secret key. Buraya yalnızca publishable key yazılır.");
 store.set("sb_url",g("u")||DEFAULT_URL);store.set("sb_key",key);sb=makeClient();if(!sb)return loginView("Kütüphane yüklenemedi. İnternet bağlantını kontrol et.");
 const {data,error}=await sb.auth.signInWithPassword({email:g("e").toLowerCase(),password:document.getElementById("p").value});
 if(error)return loginView(/Invalid API key/i.test(error.message)?"Anahtar geçersiz. Settings → API Keys sayfasından publishable key'i (ya da Legacy sekmesindeki anon key'i) kopyala.":"Giriş başarısız: "+error.message);
 if(!(await isAdmin(data.user.id))){await sb.auth.signOut();return loginView("Bu hesabın yönetici yetkisi yok.")}
 route()}
async function isAdmin(id){const {data}=await sb.from("profiles").select("role,status").eq("id",id).maybeSingle();return data?.role==="admin"&&data?.status==="active"}

/* ---------- çerçeve ---------- */
function shell(body){app.innerHTML=`<header><div class="row1"><h1>Kurye Platformu · Yönetim</h1><button id="out">Çıkış</button></div>
<nav>${NAV.map(([k,n])=>`<a href="#${k}" class="${view===k?"on":""}">${n}</a>`).join("")}</nav></header>
<main>${msg?`<div class="err">${esc(msg)}</div>`:""}${body}</main>`;
 document.getElementById("out").onclick=async()=>{await sb.auth.signOut();loginView()}}
async function route(){view=(location.hash||"#panel").slice(1);if(!NAV.some(n=>n[0]===view))view="panel";msg="";
 shell(`<p class="mu">Yükleniyor…</p>`);
 try{shell(await VIEWS[view]())}catch(e){msg=e.message||String(e);shell("")}}
async function act(fn){try{await fn();msg=""}catch(e){msg=e.message||String(e)}await route()}
window.addEventListener("hashchange",()=>sb&&route());

/* ---------- ekranlar ---------- */
const cnt=async q=>{const r=await q;if(r.error)throw new Error(r.error.message);return r.count??0};
const VIEWS={
async panel(){const h={count:"exact",head:true};
 const [pb,pc,ol,ad,oc,pp,po,cities]=await Promise.all([
  cnt(sb.from("profiles").select("id",h).eq("role","business").eq("status","pending")),
  cnt(sb.from("profiles").select("id",h).eq("role","courier").eq("status","pending")),
  cnt(sb.from("listings").select("id",h).eq("status","open")),
  cnt(sb.from("deliveries").select("id",h).in("status",["courier_selected","heading_to_pickup","picked_up","in_transit"])),
  cnt(sb.from("complaints").select("id",h).in("status",["open","investigating"])),
  cnt(sb.from("payments").select("id",h).eq("status","pending")),
  cnt(sb.from("payouts").select("id",h).in("status",["pending","processing"])),
  sb.from("admin_city_stats").select("*").order("gross_volume",{ascending:false}).then(unwrap)]);
 const cards=[["Onay bekleyen işletme",pb,"isletmeler"],["Onay bekleyen kurye",pc,"kuryeler"],["Açık ilan",ol,"ilanlar"],["Aktif teslimat",ad,"ilanlar"],["Açık şikâyet",oc,"sikayetler"],["Tahsil edilecek ödeme",pp,"odemeler"],["Bekleyen kurye ödemesi",po,"odemeler"]];
 return `<h2>Genel bakış</h2><div class="cards">${cards.map(([l,v,k])=>`<a href="#${k}" class="card" style="text-decoration:none;color:inherit"><span class="mu">${l}</span><b class="big">${v}</b></a>`).join("")}</div>
 <h3>Şehir bazlı istatistik</h3><div class="card tw"><table><tr><th>Şehir</th><th class="n">İlan</th><th class="n">Tamamlanan</th><th class="n">İptal</th><th class="n">Hacim</th><th class="n">Komisyon</th></tr>
 ${cities.length?cities.map(c=>`<tr><td>${esc(c.city??"Belirtilmemiş")}</td><td class="n">${c.listings_total}</td><td class="n">${c.completed}</td><td class="n">${c.cancelled}</td><td class="n">${money(c.gross_volume)}</td><td class="n">${money(c.commission_total)}</td></tr>`).join(""):`<tr><td colspan="6" class="mu">Henüz veri yok.</td></tr>`}</table></div>`},

async kullanicilar(){const rows=unwrap(await sb.from("profiles").select("id,role,status,full_name,phone,created_at,business_profiles(business_name,verified),courier_profiles(verified,vehicle_type)").order("created_at",{ascending:false}).limit(500));
 const q=filt.q.toLowerCase(),list=rows.filter(u=>(!filt.role||u.role===filt.role)&&(!filt.status||u.status===filt.status)&&(!q||`${u.full_name} ${u.phone??""} ${one(u.business_profiles)?.business_name??""}`.toLowerCase().includes(q)));
 setTimeout(bindFilters);
 return `<h2>Kullanıcılar</h2><div class="filters"><input id="fq" placeholder="Ara (ad, telefon, işletme)" value="${esc(filt.q)}">
 <select id="fr"><option value="">Tüm roller</option>${Object.entries(ROLE).map(([k,v])=>`<option value="${k}" ${filt.role===k?"selected":""}>${v}</option>`).join("")}</select>
 <select id="fs"><option value="">Tüm durumlar</option>${Object.entries(ACC).map(([k,v])=>`<option value="${k}" ${filt.status===k?"selected":""}>${v}</option>`).join("")}</select></div>
 ${list.map(u=>{const b=one(u.business_profiles),c=one(u.courier_profiles);return `<div class="card"><div class="sp"><div><b>${esc(u.full_name||"(adsız)")}</b>${b?`<div class="mu">${esc(b.business_name)}</div>`:""}<div class="mu">${ROLE[u.role]} · ${esc(u.phone??"telefon yok")} · ${when(u.created_at)}</div></div><div>${pill(u.status,ACC[u.status])}${(b??c)?.verified?" ✓":""}</div></div>
 ${u.role!=="admin"?`<div class="row" style="margin-top:8px">${u.status!=="active"?`<button class="b ok" data-act="approve" data-id="${u.id}">Onayla</button>`:`<button class="b dg" data-act="suspend" data-id="${u.id}">Askıya al</button>`}</div>`:""}</div>`}).join("")||`<p class="mu">Sonuç yok.</p>`}`},

async isletmeler(){const rows=unwrap(await sb.from("business_profiles").select("id,business_name,contact_person,address,city,tax_number,tax_office,category,verified,created_at,profiles(status,phone)").order("created_at",{ascending:false}).limit(300));
 rows.sort((a,b)=>(one(a.profiles)?.status==="pending"?0:1)-(one(b.profiles)?.status==="pending"?0:1));
 return `<h2>İşletme onayı</h2><p class="mu">Bekleyenler üstte. Vergi bilgilerini kontrol edip onayla.</p>${rows.map(b=>{const p=one(b.profiles);return `<div class="card"><div class="sp"><div><b>${esc(b.business_name)}</b><div class="mu">${esc(b.category??"")} · ${esc(b.contact_person)} · ${esc(p?.phone??"")}</div><div class="mu">Vergi: ${esc(b.tax_number??"-")} / ${esc(b.tax_office??"-")}</div><div class="mu">${esc(b.address)} ${esc(b.city??"")}</div></div><div>${pill(p?.status,ACC[p?.status])}${b.verified?" ✓":""}</div></div>
 <div class="row" style="margin-top:8px">${p?.status!=="active"?`<button class="b ok" data-act="approve" data-id="${b.id}">Onayla</button>`:`<button class="b dg" data-act="suspend" data-id="${b.id}">Askıya al</button>`}</div></div>`}).join("")||`<p class="mu">Henüz işletme kaydı yok.</p>`}`},

async kuryeler(){const rows=unwrap(await sb.from("courier_profiles").select("id,vehicle_type,plate,license_no,license_expiry,work_regions,capacity_kg,verified,avg_rating,completed_count,cancelled_count,profiles(status,full_name,phone),courier_documents(id,doc_type,status,file_path)").order("created_at",{ascending:false}).limit(300));
 rows.sort((a,b)=>(one(a.profiles)?.status==="pending"?0:1)-(one(b.profiles)?.status==="pending"?0:1));
 return `<h2>Kurye doğrulama</h2><p class="mu">Belgeleri incele, sonra kuryeyi doğrulayıp aktifleştir. Belge bağlantıları 5 dakika geçerlidir.</p>${rows.map(c=>{const p=one(c.profiles);return `<div class="card"><div class="sp"><div><b>${esc(p?.full_name)}</b><div class="mu">${esc(p?.phone??"")} · ${VEH[c.vehicle_type]} · ${esc(c.plate??"")} · ${c.capacity_kg??"?"} kg</div><div class="mu">Ehliyet: ${esc(c.license_no??"-")} · Bölge: ${esc((c.work_regions||[]).join(", ")||"-")}</div><div class="mu">${Number(c.avg_rating).toFixed(1)} ★ · ${c.completed_count} teslim · ${c.cancelled_count} iptal</div></div><div>${pill(p?.status,ACC[p?.status])}${c.verified?" ✓":""}</div></div>
 <h3 style="font-size:13px;margin:10px 0 4px">Belgeler</h3>${c.courier_documents.length?c.courier_documents.map(d=>`<div class="sp" style="padding:6px 0;border-top:1px solid var(--bd)"><div>${DOC[d.doc_type]??esc(d.doc_type)} ${pill(d.status)}</div><div class="row"><button class="b g" data-act="viewdoc" data-path="${esc(d.file_path)}">Görüntüle</button>${d.status!=="approved"?`<button class="b ok" data-act="docok" data-id="${d.id}">Onayla</button>`:""}${d.status!=="rejected"?`<button class="b dg" data-act="docno" data-id="${d.id}">Reddet</button>`:""}</div></div>`).join(""):`<p class="mu">Belge yüklemedi.</p>`}
 <div class="row" style="margin-top:8px">${p?.status!=="active"?`<button class="b ok" data-act="approve" data-id="${c.id}">Doğrula ve aktifleştir</button>`:`<button class="b dg" data-act="suspend" data-id="${c.id}">Askıya al</button>`}</div></div>`}).join("")||`<p class="mu">Henüz kurye kaydı yok.</p>`}`},

async ilanlar(){const rows=unwrap(await sb.from("listings").select("id,title,status,offered_price,road_distance_km,pickup_city,dropoff_city,pickup_at,business_profiles(business_name)").order("created_at",{ascending:false}).limit(300));
 return `<h2>İlanlar</h2>${rows.map(l=>`<div class="card"><div class="sp"><div><b>${esc(l.title)}</b><div class="mu">${esc(one(l.business_profiles)?.business_name??"")} · ${esc(l.pickup_city??"?")} → ${esc(l.dropoff_city??"?")} · ${l.road_distance_km!=null?l.road_distance_km+" km":"mesafe yok"}</div><div class="mu">${money(l.offered_price)} · alım ${when(l.pickup_at)}</div></div><div>${pill(l.status,LST[l.status])}</div></div>
 ${["draft","open"].includes(l.status)?`<div class="row" style="margin-top:8px"><button class="b dg" data-act="cancel" data-id="${l.id}" data-title="${esc(l.title)}">İlanı iptal et</button></div>`:""}</div>`).join("")||`<p class="mu">Henüz ilan yok.</p>`}`},

async sikayetler(){const rows=unwrap(await sb.from("complaints").select("id,subject,description,status,resolution,created_at,reporter:profiles!complaints_reporter_id_fkey(full_name),against:profiles!complaints_against_id_fkey(full_name)").order("created_at",{ascending:false}).limit(300));
 return `<h2>Şikâyetler</h2>${rows.map(c=>`<div class="card"><div class="sp"><div><b>${esc(c.subject)}</b><div class="mu">${esc(one(c.reporter)?.full_name)} → ${esc(one(c.against)?.full_name??"-")} · ${when(c.created_at)}</div>${c.description?`<div style="margin-top:4px">${esc(c.description)}</div>`:""}</div><div>${pill(c.status,CMP[c.status])}</div></div>
 <div class="filters" style="margin-top:8px"><select id="cs-${c.id}">${Object.entries(CMP).map(([k,v])=>`<option value="${k}" ${c.status===k?"selected":""}>${v}</option>`).join("")}</select><input id="cr-${c.id}" placeholder="Karar / not" value="${esc(c.resolution??"")}"></div>
 <button class="b" data-act="savecomp" data-id="${c.id}">Kaydet</button></div>`).join("")||`<p class="mu">Şikâyet yok.</p>`}`},

async odemeler(){const [pay,pos,unpaid,debts,dreq]=await Promise.all([
  sb.from("payments").select("id,amount,commission_amount,status,provider,created_at,business_id,courier_id,released_at,last_error").order("created_at",{ascending:false}).limit(200).then(unwrap),
  sb.from("payouts").select("id,courier_id,amount,status,provider_ref,created_at,paid_at").order("created_at",{ascending:false}).limit(200).then(unwrap),
  sb.from("deliveries").select("courier_id,courier_earning,payments(provider)").eq("status","completed").is("payout_id",null).then(unwrap),
  sb.rpc("admin_courier_debts").then(unwrap),
  sb.from("courier_debt_payments").select("id,courier_id,amount,reference,note,created_at").eq("status","pending").eq("method","transfer").order("created_at").then(unwrap)]);
 const dname=Object.fromEntries(debts.map(d=>[d.courier_id,d.full_name]));
 const owedRows=unpaid.filter(u=>!["iyzico","cash"].includes(one(u.payments)?.provider)),owed=new Map();owedRows.forEach(u=>owed.set(u.courier_id,(owed.get(u.courier_id)||0)+Number(u.courier_earning)));
 const ids=[...new Set([...pay.flatMap(p=>[p.business_id,p.courier_id]),...pos.map(p=>p.courier_id),...owed.keys()])];
 const names=ids.length?Object.fromEntries(unwrap(await sb.from("profiles").select("id,full_name").in("id",ids)).map(p=>[p.id,p.full_name])):{};
 const n=id=>esc(names[id]??String(id).slice(0,8));
 return `<h2>Ödemeler</h2><p class="mu">Kartla (iyzico) ödenenlerde aktarım ve iade otomatiktir. Nakit işlerde ücret kuryede kalır, komisyon kuryenin borcuna yazılır. Havale/EFT ödemelerini tahsil ettikten ve kuryeye ödedikten sonra buradan işaretle.</p>
 <h3>Onay bekleyen borç havaleleri</h3>${dreq.length?dreq.map(r=>`<div class="card"><div class="sp"><div><b>${esc(dname[r.courier_id]||String(r.courier_id).slice(0,8))} · ${money(r.amount)}</b><div class="mu">Açıklama kodu <b>${esc(r.reference??"")}</b> · ${when(r.created_at)}${r.note?" · "+esc(r.note):""}</div><div class="mu">Banka hesabında bu tutarı ve açıklama kodunu gördüysen onayla.</div></div></div><div class="row" style="margin-top:8px"><button class="b ok" data-act="dreqok" data-id="${r.id}">Hesaba geçti, onayla</button><button class="b dg" data-act="dreqno" data-id="${r.id}">Reddet</button></div></div>`).join(""):`<p class="mu">Bekleyen bildirim yok.</p>`}
 <h3>Kurye komisyon borçları (nakit işler)</h3>${debts.length?debts.map(d=>`<div class="card"><div class="sp"><div><b>${esc(d.full_name||String(d.courier_id).slice(0,8))}</b><div class="mu">${esc(d.phone??"")} · kod ${esc(d.reference??"")} · nakit komisyon toplamı ${money(d.cash_commission)} · ödenen ${money(d.paid_back)}${d.last_cash_at?" · son nakit iş "+when(d.last_cash_at):""}</div></div><div>${d.over_limit?pill("suspended","Limit aşıldı · teklif kapalı"):""} <b>${money(Math.max(0,Number(d.debt)))}</b></div></div>${Number(d.debt)>0?`<div class="filters" style="margin-top:8px"><input id="da-${d.courier_id}" inputmode="decimal" value="${Number(d.debt).toFixed(2)}" placeholder="Tutar"><input id="dn-${d.courier_id}" placeholder="Not (havale açıklaması vb.)"></div><button class="b ok" data-act="debtpay" data-id="${d.courier_id}">Borç ödemesi kaydet</button>`:""}</div>`).join(""):`<p class="mu">Nakit iş yapan kurye yok.</p>`}
 <h3>Kuryeye havale bekleyenler</h3>${owed.size?[...owed].map(([c,v])=>`<div class="card sp"><div><b>${n(c)}</b><div class="mu">${money(v)}</div></div><button class="b" data-act="mkpayout" data-id="${c}">Ödeme kaydı oluştur</button></div>`).join(""):`<p class="mu">Bekleyen yok.</p>`}
 <h3>Kurye ödemeleri</h3>${pos.map(p=>`<div class="card sp"><div><b>${n(p.courier_id)} · ${money(p.amount)}</b><div class="mu">${when(p.created_at)}${p.paid_at?" · ödendi "+when(p.paid_at):""}${p.provider_ref?" · "+esc(p.provider_ref):""}</div></div><div class="row">${pill(p.status)}${p.status!=="paid"?`<button class="b ok" data-act="paid" data-id="${p.id}">Ödendi</button>`:""}</div></div>`).join("")||`<p class="mu">Kayıt yok.</p>`}
 <h3>İşletme tahsilatları</h3>${pay.map(p=>`<div class="card sp"><div><b>${n(p.business_id)} → ${n(p.courier_id)}</b><div class="mu">${money(p.amount)} · komisyon ${money(p.commission_amount)} · ${p.provider==="iyzico"?"Kart (iyzico)":p.provider==="cash"?"Nakit (kuryeye elden)":"Havale/EFT"} · ${when(p.created_at)}</div>${p.released_at?`<div class="mu">Kurye payı aktarıldı</div>`:""}${p.last_error?`<div class="err">${esc(p.last_error)}</div>`:""}</div><div class="row">${pill(p.status)}${p.status==="pending"&&p.provider!=="iyzico"?`<button class="b ok" data-act="captured" data-id="${p.id}">Tahsil edildi</button>`:""}</div></div>`).join("")||`<p class="mu">Kayıt yok.</p>`}`},

async ayarlar(){const [rules,pre,lim,bank,dcard]=await Promise.all([sb.from("commission_rules").select("id,city,rate,active,created_at").order("created_at",{ascending:false}).then(unwrap),
  sb.from("platform_settings").select("value").eq("key","require_prepayment").maybeSingle().then(unwrap),
  sb.from("platform_settings").select("value").eq("key","cash_debt_limit").maybeSingle().then(unwrap),
  sb.from("platform_settings").select("value").eq("key","platform_bank").maybeSingle().then(unwrap),
  sb.from("platform_settings").select("value").eq("key","debt_card_enabled").maybeSingle().then(unwrap)]);
 const on=pre?.value===true,limit=lim?Number(lim.value):500,bk=bank?.value||{},cardOn=dcard?.value===true;
 return `<h2>Komisyon ve ayarlar</h2>
 <div class="card"><div class="sp"><div><b>Kartla ön ödeme zorunlu</b><div class="mu">Açıkken kurye, işletme kartla (iyzico) ödemeden teslimata çıkamaz. iyzico kurulmadan açma.</div></div><button class="b ${on?"ok":"g"}" data-act="prepay" data-v="${on?"0":"1"}">${on?"Açık":"Kapalı"}</button></div></div>
 <div class="card"><b>Nakit işlerde kurye borç limiti (TL)</b><div class="mu">Kuryenin ödenmemiş komisyon borcu bu tutara ulaşınca yeni teklif veremez ve teklifi kabul edilemez. 0 = limit yok. Şu an: ${limit>0?money(limit):"limit yok"}</div><div class="filters" style="margin-top:8px"><input id="dl" inputmode="decimal" value="${limit}"></div><button class="b" data-act="savelimit">Limiti kaydet</button></div>
 <div class="card"><b>Kuryelerin borç havalesi için banka bilgin</b><div class="mu">Kurye uygulamada bu bilgileri ve kendine özel açıklama kodunu görür. Boşsa havale seçeneği gösterilmez.</div><div class="filters" style="margin-top:8px"><input id="bh" placeholder="Alıcı adı / unvan" value="${esc(bk.holder??"")}"><input id="bb" placeholder="Banka adı" value="${esc(bk.bank??"")}"><input id="bi" placeholder="IBAN (TR...)" value="${esc(bk.iban??"")}"></div><button class="b" data-act="savebank">Banka bilgisini kaydet</button></div>
 <div class="card"><div class="sp"><div><b>Kuryeler borcu kartla ödeyebilsin</b><div class="mu">iyzico anahtarları ve debt-payment-init / debt-payment-callback fonksiyonları kurulmadan açma; açarsan kurye "Kartla öde" düğmesini görür ama ödeme başlamaz.</div></div><button class="b ${cardOn?"ok":"g"}" data-act="debtcard" data-v="${cardOn?"0":"1"}">${cardOn?"Açık":"Kapalı"}</button></div></div>
 <h3>Komisyon kuralları</h3><p class="mu">Şehre özel kural genel kuraldan önceliklidir; aynı kapsamda en yeni aktif kural geçerlidir. Değişiklik sonraki teslimatlara uygulanır.</p>
 <div class="filters"><input id="rc" placeholder="Şehir (boş = tüm şehirler)"><input id="rp" placeholder="Oran % (örn. 10)" inputmode="decimal"></div><button class="b" data-act="addrule">Kural ekle</button>
 ${rules.map(r=>`<div class="card sp" style="margin-top:10px"><div><b>${esc(r.city??"Tüm şehirler")} · %${(Number(r.rate)*100).toFixed(2).replace(/\.?0+$/,"")}</b><div class="mu">${when(r.created_at)}</div></div><div class="row">${pill(r.active?"active":"suspended",r.active?"Aktif":"Pasif")}<button class="b g" data-act="togrule" data-id="${r.id}" data-v="${r.active?"0":"1"}">${r.active?"Pasifleştir":"Aktifleştir"}</button></div></div>`).join("")}`}};

function bindFilters(){const q=document.getElementById("fq"),r=document.getElementById("fr"),s=document.getElementById("fs");if(!q)return;
 let t;q.oninput=()=>{clearTimeout(t);t=setTimeout(()=>{filt.q=q.value;route().then(()=>{const n=document.getElementById("fq");if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length)}})},350)};
 r.onchange=()=>{filt.role=r.value;route()};s.onchange=()=>{filt.status=s.value;route()}}

/* ---------- eylemler ---------- */
const ACTIONS={
approve:el=>act(async()=>unwrap(await sb.rpc("admin_set_account",{p_user:el.dataset.id,p_status:"active",p_verified:true,p_reason:null}))),
suspend:el=>{const reason=prompt("Askıya alma nedeni (kullanıcıya bildirim olarak gider):");if(reason===null)return;act(async()=>unwrap(await sb.rpc("admin_set_account",{p_user:el.dataset.id,p_status:"suspended",p_verified:null,p_reason:reason})))},
viewdoc:async el=>{const {data,error}=await sb.storage.from("courier-documents").createSignedUrl(el.dataset.path,300);if(error||!data){msg=error?.message??"Bağlantı oluşturulamadı";return route()}window.open(data.signedUrl,"_blank","noopener")},
docok:el=>act(async()=>{const {data:s}=await sb.auth.getSession();unwrap(await sb.from("courier_documents").update({status:"approved",rejection_reason:null,reviewed_by:s.session?.user.id,reviewed_at:new Date().toISOString()}).eq("id",el.dataset.id))}),
docno:el=>{const reason=prompt("Red nedeni (kurye görecek):");if(reason===null)return;act(async()=>{const {data:s}=await sb.auth.getSession();unwrap(await sb.from("courier_documents").update({status:"rejected",rejection_reason:reason,reviewed_by:s.session?.user.id,reviewed_at:new Date().toISOString()}).eq("id",el.dataset.id))})},
cancel:el=>{if(!confirm(`"${el.dataset.title}" ilanı iptal edilsin mi? Bekleyen teklif sahiplerine bildirim gider.`))return;act(async()=>unwrap(await sb.from("listings").update({status:"cancelled"}).eq("id",el.dataset.id)))},
savecomp:el=>{const id=el.dataset.id,st=document.getElementById("cs-"+id).value,res=document.getElementById("cr-"+id).value;act(async()=>{const {data:s}=await sb.auth.getSession();const closed=st==="resolved"||st==="dismissed";unwrap(await sb.from("complaints").update({status:st,resolution:res||null,resolved_by:closed?s.session?.user.id:null}).eq("id",id))})},
mkpayout:el=>act(async()=>unwrap(await sb.rpc("admin_create_payout",{p_courier:el.dataset.id}))),
paid:el=>{const ref=prompt("Ödeme referansı (dekont no vb.), boş bırakılabilir:","");if(ref===null)return;act(async()=>unwrap(await sb.rpc("admin_mark_payout_paid",{p_payout:el.dataset.id,p_ref:ref||null})))},
captured:el=>{const ref=prompt("Tahsilat referansı (havale açıklaması vb.), boş bırakılabilir:","");if(ref===null)return;act(async()=>unwrap(await sb.rpc("admin_mark_payment_captured",{p_payment:el.dataset.id,p_ref:ref||null})))},
prepay:el=>{const v=el.dataset.v==="1";if(v&&!confirm("Ön ödeme zorunluluğunu açarsan kuryeler, işletme kartla ödemeden yola çıkamaz. iyzico kurulu değilse teslimatlar durur. Açılsın mı?"))return;act(async()=>unwrap(await sb.from("platform_settings").upsert({key:"require_prepayment",value:v,updated_at:new Date().toISOString()})))},
debtpay:el=>{const id=el.dataset.id,amt=Number(document.getElementById("da-"+id).value.replace(",",".")),note=document.getElementById("dn-"+id).value.trim();if(!isFinite(amt)||amt<=0){msg="Geçerli bir tutar gir.";return route()}
 act(async()=>unwrap(await sb.rpc("admin_record_debt_payment",{p_courier:id,p_amount:amt,p_note:note||null})))},
dreqok:el=>{if(!confirm("Havale banka hesabına geçti mi? Onaylarsan kuryenin borcundan düşülür."))return;act(async()=>unwrap(await sb.rpc("admin_review_debt_payment",{p_id:el.dataset.id,p_approve:true,p_reason:null})))},
dreqno:el=>{const reason=prompt("Red nedeni (kurye görecek):","Havale hesaba ulaşmadı");if(reason===null)return;act(async()=>unwrap(await sb.rpc("admin_review_debt_payment",{p_id:el.dataset.id,p_approve:false,p_reason:reason||null})))},
savebank:()=>{const holder=document.getElementById("bh").value.trim(),bankName=document.getElementById("bb").value.trim(),iban=document.getElementById("bi").value.replace(/\s+/g,"").toUpperCase();
 if(iban&&!/^TR\d{24}$/.test(iban)){msg="IBAN TR ile başlamalı ve 26 karakter olmalı.";return route()}if(iban&&!holder){msg="Alıcı adını da yaz.";return route()}
 act(async()=>unwrap(await sb.from("platform_settings").upsert({key:"platform_bank",value:{iban,holder,bank:bankName},updated_at:new Date().toISOString()})))},
debtcard:el=>{const v=el.dataset.v==="1";if(v&&!confirm("iyzico ve borç ödeme fonksiyonları kurulu mu? Kurulu değilse kuryeler kartla ödeyemez ve hata görür. Açılsın mı?"))return;act(async()=>unwrap(await sb.from("platform_settings").upsert({key:"debt_card_enabled",value:v,updated_at:new Date().toISOString()})))},
savelimit:()=>{const v=Number(document.getElementById("dl").value.replace(",","."));if(!isFinite(v)||v<0){msg="Limit 0 ya da pozitif bir sayı olmalı.";return route()}
 act(async()=>unwrap(await sb.from("platform_settings").upsert({key:"cash_debt_limit",value:v,updated_at:new Date().toISOString()})))},
addrule:()=>{const city=document.getElementById("rc").value.trim(),pct=Number(document.getElementById("rp").value.replace(",","."));if(!isFinite(pct)||pct<0||pct>=100){msg="Oran 0 ile 100 arasında olmalı (örn. 10).";return route()}
 act(async()=>unwrap(await sb.from("commission_rules").insert({city:city||null,rate:pct/100,active:true})))},
togrule:el=>act(async()=>unwrap(await sb.from("commission_rules").update({active:el.dataset.v==="1"}).eq("id",el.dataset.id)))};
document.addEventListener("click",e=>{const el=e.target.closest("[data-act]");if(el&&ACTIONS[el.dataset.act]){e.preventDefault();ACTIONS[el.dataset.act](el)}});

/* ---------- başlangıç ---------- */
(async()=>{if(!window.supabase){app.innerHTML=`<div class="login"><h2>Bağlantı yok</h2><p class="mu">Supabase kütüphanesi yüklenemedi. İnternet bağlantını kontrol edip sayfayı yenile.</p></div>`;return}
 sb=makeClient();if(!sb)return loginView();
 const {data}=await sb.auth.getSession();
 if(data.session&&await isAdmin(data.session.user.id))route();else loginView()})();
</script>
